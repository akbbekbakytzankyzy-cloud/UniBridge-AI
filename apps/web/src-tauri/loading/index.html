<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>UniBridgeAI</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center;
        font-family: system-ui, sans-serif; background: #f4f6fb; color: #1e293b; }
      .box { text-align: center; }
      .spin { width: 40px; height: 40px; margin: 0 auto 20px; border-radius: 50%;
        border: 4px solid #dbe4fb; border-top-color: #2563eb; animation: s 1s linear infinite; }
      @keyframes s { to { transform: rotate(360deg); } }
      p { color: #64748b; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <h1>UniBridgeAI</h1>
      <p>Запуск локальной базы данных… / Starting the local database…</p>
    </div>
  </body>
</html>
