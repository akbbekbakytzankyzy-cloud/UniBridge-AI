[package]
name = "unibridge-desktop"
version = "0.1.0"
description = "UniBridgeAI campus desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
getrandom = "0.3"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }

[profile.release]
strip = true
lto = true
